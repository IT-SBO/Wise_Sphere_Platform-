<!-- /var/ossec/etc/shared/<CLnnn>-servers/agent.conf on the manager (§4.7: group CLnnn-servers) -->
<agent_config>
  <labels>
    <label key="client">CL001</label>
    <label key="site">KWI</label>
  </labels>
  <!-- SOC-01: FIM, SCA (CIS) and vulnerability detection per client group -->
  <syscheck>
    <frequency>43200</frequency>
    <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
</agent_config>
